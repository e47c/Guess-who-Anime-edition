<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Card Gallery (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&family=Dela+Gothic+One&family=Pirata+One&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css?v=13">
<link rel="stylesheet" href="../css/cards.css?v=3">
<link rel="stylesheet" href="../css/packs.css?v=1">
<style>
/* DEV ONLY: every card of every series, to scan for cut-off faces. Not linked from the game. */
body { margin: 0; padding: 16px; background: #0b0810; color: #eee; font: 500 14px/1.4 Inter, sans-serif; }
h1 { margin: 0 0 6px; font: 400 26px/1 'Dela Gothic One'; }
.bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; background: #0b0810; }
.bar button, .bar select { padding: 6px 10px; border-radius: 6px; border: 1px solid #555; background: #1c1824; color: #eee; font: 600 13px Inter; cursor: pointer; }
.bar button.on { background: #b38bff; color: #120820; }
h2 { margin: 22px 0 8px; font: 600 22px/1 Teko; letter-spacing: .06em; text-transform: uppercase; }
.grid { display: flex; flex-wrap: wrap; gap: 10px; }
.cell { display: grid; justify-items: center; gap: 3px; }
.cell > small { font: 600 10px/1.2 'JetBrains Mono'; color: #aaa; max-width: 120px; text-align: center; }
.cell > small b { color: #ffd76a; }
.cell.fit > small b { color: #7df3ff; } .cell.zoom > small b { color: #9dff57; } .cell.fixed > small b { color: #ff7ab6; }
.legend span { margin-right: 12px; }
.vc-art.rv { position: relative; left: auto; top: auto; width: 150px; aspect-ratio: var(--art-ar, 1); box-shadow: 0 0 0 2px #8b919c; }
</style>
</head>
<body>
<h1>Card gallery · dev</h1>
<p class="legend">Every card, every series, grouped by series. Under each card: id, how its face was found (<b style="color:#ffd76a">det</b> = detected, <b style="color:#ffd76a">default</b> = no face found, upper third) and how it is shown (<b style="color:#7df3ff">fit</b> = whole picture over a blurred copy, <b style="color:#9dff57">zoom</b>, <b style="color:#ff7ab6">fixed</b> = hand-corrected in data/card-focus-fix.json).</p>
<div class="bar"><span>Size</span><button data-size="sm" class="on">small</button><button data-size="md">medium</button><button data-size="lg">large</button><button data-size="art">art windows only</button>
<span>Show</span><select id="show"><option value="">all cards</option><option value="default">no face found</option><option value="fit">fit (whole picture)</option><option value="zoom">zoomed</option><option value="fixed">hand-fixed</option><option value="r3">Ultra Rare+</option></select>
<select id="series"><option value="">every series</option></select><span id="count"></span></div>
<div id="out"></div>
<script type="module">
import { CARDS, BY_SERIES, CARD_SERIES } from "../js/vault/carddb.js?v=2";
import { cardEl, theme, artPlace } from "../js/vault/cardui.js?v=4";
const focus = await fetch("../data/card-focus.json").then(r => r.json()).catch(() => ({}));
const fix = await fetch("../data/card-focus-fix.json").then(r => r.json()).catch(() => ({}));
let size = "sm";
const sel = document.getElementById("series"); CARD_SERIES.forEach(s => sel.add(new Option(theme(s).label, s)));
function draw() {
    const out = document.getElementById("out"), show = document.getElementById("show").value, only = sel.value; out.innerHTML = ""; let n = 0;
    CARD_SERIES.filter(s => !only || s === only).forEach(s => {
        const ids = BY_SERIES[s].filter(id => { const c = CARDS[id], f = focus[id] || {}; return !show || (show === "default" && f.src === "default") || (show === "fit" && c.fit) || (show === "zoom" && c.fz > 1) || (show === "fixed" && fix[id]) || (show === "r3" && c.r >= 3); });
        if (!ids.length) return;
        const h = document.createElement("h2"); h.textContent = theme(s).label + " (" + ids.length + ")"; out.appendChild(h);
        const g = document.createElement("div"); g.className = "grid";
        ids.forEach(id => { const c = CARDS[id], f = focus[id] || {}, cell = document.createElement("div"); cell.className = "cell" + (c.fit ? " fit" : c.fz > 1 ? " zoom" : "") + (fix[id] ? " fixed" : ""); cell.dataset.id = id;
            if (size === "art") {      // the square window exactly as a Common..Epic card places it (same artPlace), bigger
                const a = document.createElement("div"), im = new Image(); a.className = "vc-art rv"; im.referrerPolicy = "no-referrer"; im.alt = "";
                if (c.img) { artPlace(Object.assign({}, c, { r: 0 }), a, im); im.src = c.img; a.appendChild(im); } else a.textContent = "?";
                cell.appendChild(a);
            } else cell.appendChild(cardEl(id, { size }));
            const t = document.createElement("small"); t.innerHTML = id + " · <b>" + (fix[id] ? "fixed" : f.src || "none") + (c.fit ? " · fit" : c.fz > 1 ? " · zoom " + c.fz : "") + "</b><br>" + c.n; cell.appendChild(t); g.appendChild(cell); n++; });
        out.appendChild(g);
    });
    out.querySelectorAll("img").forEach(i => { i.loading = "eager"; });
    document.getElementById("count").textContent = n + " cards";
}
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => { size = b.dataset.size; document.querySelectorAll("[data-size]").forEach(x => x.classList.toggle("on", x === b)); draw(); });
document.getElementById("show").onchange = draw; sel.onchange = draw;
draw(); window.__ready = true;
</script>
</body>
</html>
